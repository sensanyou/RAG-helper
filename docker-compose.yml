# Milvus 向量数据库（Standalone）— 生产级部署方案
#
# 架构：独立 etcd 容器（元数据）+ Milvus 本地存储（对象数据，无需 MinIO）。
# 说明：MinIO 官方已从国内镜像站下架镜像无法拉取，故单机部署采用
# COMMON_STORAGETYPE=local 让 Milvus 把对象数据落到本地盘。
#
# 使用方式：
#   1. 创建 .env 文件（参考下方示例）或直接设置环境变量
#   2. 启动 Milvus:  docker compose up -d milvus
#   3. 等待就绪:     docker compose ps  （milvus 状态 Up，日志无报错，约 30-60 秒）
#   4. 全套启动:     docker compose up -d
#   5. 停止:         docker compose down
#   6. 清理数据:     docker compose down -v
#
# .env 文件示例：
#   APP_RAG_CHAT_API_KEY=sk-deepseek-xxx
#   APP_RAG_EMBEDDING_API_KEY=sk-siliconflow-xxx

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: rag-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: |
      etcd --data-dir=/etcd
        --listen-client-urls http://0.0.0.0:2379
        --advertise-client-urls http://0.0.0.0:2379

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: rag-milvus
    command: milvus run standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: local                               # 对象数据落本地盘（MinIO 已从国内镜像站下架，本地存储即可满足单机部署）
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC（应用连接端口）
      - "9091:9091"     # HTTP 健康检查
    depends_on:
      - etcd
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: rag_study_helper
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: rag-app
    ports:
      - "8080:8080"
    environment:
      # === 向量库 ===
      VECTOR_STORE_TYPE: milvus
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      # === MySQL ===
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rag_study_helper?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # === Redis ===
      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${SPRING_REDIS_PORT:-6379}
      SPRING_REDIS_PASSWORD: ${SPRING_REDIS_PASSWORD:-}
      # === RAG 基础配置 ===
      APP_RAG_CHAT_API_KEY: ${APP_RAG_CHAT_API_KEY}
      APP_RAG_CHAT_BASE_URL: ${APP_RAG_CHAT_BASE_URL:-https://api.deepseek.com}
      APP_RAG_CHAT_MODEL_NAME: ${APP_RAG_CHAT_MODEL_NAME:-deepseek-chat}
      APP_RAG_EMBEDDING_API_KEY: ${APP_RAG_EMBEDDING_API_KEY}
      APP_RAG_EMBEDDING_BASE_URL: ${APP_RAG_EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      APP_RAG_EMBEDDING_MODEL_NAME: ${APP_RAG_EMBEDDING_MODEL_NAME:-BAAI/bge-large-zh-v1.5}
      APP_RAG_RERANK_API_KEY: ${APP_RAG_RERANK_API_KEY:-${APP_RAG_EMBEDDING_API_KEY}}
      APP_RAG_RERANK_BASE_URL: ${APP_RAG_RERANK_BASE_URL:-https://api.siliconflow.cn/v1}
      APP_RAG_RERANK_MODEL_NAME: ${APP_RAG_RERANK_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
      APP_RAG_SCORE_THRESHOLD: ${APP_RAG_SCORE_THRESHOLD:-0.80}
    depends_on:
      milvus:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  etcd-data:
  milvus-data:
  mysql-data:
