<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - RAG Study Helper</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }
  .card {
    width: 380px; background: #fff; border-radius: 16px;
    padding: 36px 32px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  h1 { font-size: 22px; color: #333; text-align: center; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #999; text-align: center; margin-bottom: 26px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 13px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; outline: none; transition: border-color .2s;
  }
  .field input:focus { border-color: #667eea; }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    font-size: 15px; cursor: pointer; transition: opacity .2s; margin-top: 6px;
  }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #submitBtn { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .switch { text-align: center; margin-top: 18px; font-size: 13px; color: #888; }
  .switch a { color: #667eea; cursor: pointer; text-decoration: none; }
  .error {
    display: none; background: #fde8e8; color: #c0392b; font-size: 13px;
    padding: 10px 12px; border-radius: 8px; margin-bottom: 14px;
  }
  .error.visible { display: block; }
  .hint { font-size: 12px; color: #aaa; margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">登录</h1>
  <div class="sub">RAG 学习知识库 · 多用户版</div>
  <div class="error" id="error"></div>

  <div class="field" id="displayNameField" style="display:none">
    <label>昵称（可选）</label>
    <input id="displayName" placeholder="怎么称呼你" maxlength="32">
  </div>
  <div class="field">
    <label>用户名</label>
    <input id="username" placeholder="3~32 位字母、数字或下划线" maxlength="32" autocomplete="username">
  </div>
  <div class="field">
    <label>密码</label>
    <input id="password" type="password" placeholder="6~64 位" maxlength="64" autocomplete="current-password">
    <div class="hint" id="pwdHint" style="display:none">至少 6 位，注册时请记牢，暂不支持找回</div>
  </div>

  <button id="submitBtn" onclick="submit()">登 录</button>
  <div class="switch">
    <span id="switchText">还没有账号？</span><a id="switchLink" onclick="toggleMode()">立即注册</a>
  </div>
</div>

<script>
var mode = 'login'; // login | register

function toggleMode() {
  mode = (mode === 'login') ? 'register' : 'login';
  document.getElementById('title').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('submitBtn').textContent = mode === 'login' ? '登 录' : '注 册';
  document.getElementById('switchText').textContent = mode === 'login' ? '还没有账号？' : '已有账号？';
  document.getElementById('switchLink').textContent = mode === 'login' ? '立即注册' : '去登录';
  document.getElementById('displayNameField').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('pwdHint').style.display = mode === 'register' ? 'block' : 'none';
  showError('');
}

function showError(msg) {
  var el = document.getElementById('error');
  el.textContent = msg;
  el.classList.toggle('visible', !!msg);
}

function submit() {
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;
  var displayName = document.getElementById('displayName').value.trim();
  if (!username || !password) { showError('请填写用户名和密码'); return; }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '请稍候…';
  showError('');

  var url = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
  var body = mode === 'register'
      ? { username: username, password: password, displayName: displayName }
      : { username: username, password: password };

  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
  .then(function(res) {
    if (res.ok && res.data.obj && res.data.obj.token) {
      localStorage.setItem('rag_token', res.data.obj.token);
      window.location.href = 'index.html';
    } else {
      showError(res.data.msg || '操作失败');
      btn.disabled = false; btn.textContent = mode === 'login' ? '登 录' : '注 册';
    }
  })
  .catch(function() {
    showError('网络错误，请稍后重试');
    btn.disabled = false; btn.textContent = mode === 'login' ? '登 录' : '注 册';
  });
}

document.addEventListener('keydown', function(e) { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
